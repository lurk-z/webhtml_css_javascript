<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - Jadoo</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://websiteanalytics-te00.onrender.com/tracker.js"
      data-endpoint="https://websiteanalytics-te00.onrender.com/api/collect"
      data-project="45ea01d6-e591-4b55-ac68-552cfee0e3cc"
      defer></script>
    <style>
        .form-container {
            max-width: 500px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h1 {
            font-size: 32px;
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        .form-header p {
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-yellow);
            color: var(--text-dark);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background: #f5a500;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(253, 176, 34, 0.3);
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
        }

        .form-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .custom-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s;
            max-width: 400px;
        }

        .custom-alert.show {
            opacity: 1;
        }

        .custom-alert.success {
            background: #4caf50;
            color: white;
        }

        .custom-alert.error {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <a href="index.html" class="logo">Jadoo</a>
                <ul class="nav-menu">
                    <li><a href="index.html">หน้าแรก</a></li>
                    <li><a href="destinations.html">จุดหมายปลายทาง</a></li>
                    <li><a href="hotels.html">โรงแรม</a></li>
                </ul>
                <div class="auth-buttons">
                    <a href="login.html" class="btn-login">เข้าสู่ระบบ</a>
                    <a href="signup.html" class="btn-signup">สมัครสมาชิก</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Signup Form -->
    <div class="form-container">
        <div class="form-header">
            <h1>สมัครสมาชิก</h1>
            <p>เข้าร่วมเราและเริ่มท่องเที่ยว</p>
        </div>

        <form id="signupForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">ชื่อจริง</label>
                    <input type="text" id="firstName" name="firstName" placeholder="เช่น สมชาย" required>
                </div>
                <div class="form-group">
                    <label for="lastName">นามสกุล</label>
                    <input type="text" id="lastName" name="lastName" placeholder="เช่น สมิทธิ์" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" name="password" placeholder="อย่างน้อย 6 ตัวอักษร" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="พิมพ์รหัสผ่านอีกครั้ง" required>
            </div>

            <button type="submit" class="submit-btn">สมัครสมาชิก</button>
        </form>

        <div class="form-footer">
            มีบัญชีแล้วหรือ? <a href="login.html">เข้าสู่ระบบ</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Jadoo</title>
    <link rel="stylesheet" href="styles.css">
        <script src="https://websiteanalytics-te00.onrender.com/tracker.js"
            data-endpoint="https://websiteanalytics-te00.onrender.com/api/collect"
            data-project="777a41c3-17bf-4845-9e43-81227b58fc68"
            defer></script>
    <style>
        .form-container {
            max-width: 500px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h1 {
            font-size: 32px;
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        .form-header p {
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            font-size: 14px;
        }

        .remember-forgot input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .remember-forgot a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-yellow);
            color: var(--text-dark);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background: #f5a500;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(253, 176, 34, 0.3);
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
        }

        .form-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .custom-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s;
            max-width: 400px;
        }

        .custom-alert.show {
            opacity: 1;
        }

        .custom-alert.success {
            background: #4caf50;
            color: white;
        }

        .custom-alert.error {
            background: #f44336;
            color: white;
        }

        .demo-login {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-light);
        }

        .demo-login p {
            margin: 5px 0;
        }

        .demo-login code {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <a href="index.html" class="logo">Jadoo</a>
                <ul class="nav-menu">
                    <li><a href="index.html">หน้าแรก</a></li>
                    <li><a href="destinations.html">จุดหมายปลายทาง</a></li>
                    <li><a href="hotels.html">โรงแรม</a></li>
                </ul>
                <div class="auth-buttons">
                    <a href="login.html" class="btn-login">เข้าสู่ระบบ</a>
                    <a href="signup.html" class="btn-signup">สมัครสมาชิก</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="form-container">
        <div class="form-header">
            <h1>เข้าสู่ระบบ</h1>
            <p>ยินดีต้อนรับกลับมา</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" name="password" placeholder="รหัสผ่านของคุณ" required>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" name="remember"> จำฉันไว้
                </label>
                <a href="#">ลืมรหัสผ่าน?</a>
            </div>

            <button type="submit" class="submit-btn">เข้าสู่ระบบ</button>
        </form>

        <div class="form-footer">
            ยังไม่มีบัญชี? <a href="signup.html">สมัครสมาชิกตอนนี้</a>
        </div>

        <div class="demo-login">
            <p><strong>ทดสอบการใช้งาน:</strong></p>
            <p>1. ไปที่หน้า <a href="signup.html" style="color: var(--primary-color);">สมัครสมาชิก</a> เพื่อสร้างบัญชี</p>
            <p>2. หรือสมัครแล้วใช้อีเมลและรหัสผ่าน</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
